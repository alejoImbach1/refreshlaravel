models:
    Person:
        id: id
        nuip_type: enum:"CEDULA_CIUDADANIA","REGISTRO_CIVIL_NACIMIENTO","TARJETA_IDENTIDAD","CEDULA_EXTRANJERIA","PASAPORTE" default:"CEDULA_CIUDADANIA"
        nuip: string:10 unique nullable
        name: string:80
        surname: string:80
        gender: enum:"MALE","FEMALE","OTHER"
        birth_date: date
        email: string nullable
        phone_number: string:10 nullable
        relationships:
            hasOne: Employee, Customer, User
            hasMany: AcademicBackground

    Department:
        id: id
        code: string:15 unique
        name: string:50 unique
        physical_location: string:50
        relationships:
            hasMany: Employee

    JobPosition:
        id: id
        name: string unique
        relationships:
            hasMany: Employee

    AcademicProgram:
        id: id
        name: string:100
        degree_title: string:100
        academic_level: enum:"PRIMARIA","BASICA","MEDIA","PREGRADO","POSGRADO"
        relationships:
            hasMany: AcademicBackground
            belongsToMany: AcademicInstitution

    AcademicInstitution:
        id: id
        name: string:100
        address: string
        relationships:
            belongsToMany: AcademicProgram

    AcademicBackground:
        id: id
        status: enum:"FINISHED","PROGRESS"
        starting_date: date nullable
        finishing_date: date nullable
        person_id: bigInteger unsigned foreign:people.id
        academic_program_id: bigInteger unsigned foreign:academic_programs.id
        relationships:
            belongsTo: Person, AcademicProgram

    Employee:
        id: id
        salary: decimal:12,2
        hiring_date: date
        job_position_id: bigInteger unsigned foreign:job_positions.id
        person_id: bigInteger unsigned foreign:people.id
        department_id: bigInteger unsigned foreign:departments.id
        relationships:
            hasMany: Order
            belongsTo: JobPosition, Person, Department

    Customer:
        id: id
        person_id: bigInteger unsigned foreign:people.id
        relationships:
            hasMany: Order
            belongsTo: Person

    Product:
        id: id
        sku: string:10 unique
        slug: string unique
        name: string unique
        price: decimal
        relationships:
            belongsToMany: Order

    Order:
        id: id
        customer_id: bigInteger nullable unsigned foreign:customers.id
        employee_id: bigInteger unsigned foreign:employees.id
        relationships:
            belongsToMany: Product
            belongsTo: Customer, Employee